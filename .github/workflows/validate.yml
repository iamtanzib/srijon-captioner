name: Validate source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate feature invariants
        run: python tools/validate_project.py

      - name: Check source syntax
        shell: pwsh
        run: |
          node --check source/premiere-plugin/index.js
          python -m py_compile source/premiere-plugin/server.py source/whisper-server/server.py

      - name: Build CCX
        run: python tools/build_ccx.py --version 1.2.14 --name Srijon-Captioner-v1.2.14-CI.ccx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: srijon-captioner-${{ github.sha }}
          path: build/Srijon-Captioner-v1.2.14-CI.ccx
          if-no-files-found: error
          retention-days: 14
